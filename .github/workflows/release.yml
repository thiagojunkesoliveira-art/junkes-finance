name: Publicar versão

# Publica uma nova versão sempre que o número em package.json mudar.
on:
  push:
    branches: [main]
    paths: ["package.json", "src/**", "app/**", "assets/**", "build.js", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver se esta versão já foi publicada
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "A versão v$V já existe. Nada a publicar."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.publicar == 'sim'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.ver.outputs.publicar == 'sim'

      - name: Montar e publicar o instalador
        if: steps.ver.outputs.publicar == 'sim'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
